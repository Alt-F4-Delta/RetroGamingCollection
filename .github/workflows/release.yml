name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify updater, filters and data migration
        run: dotnet run --project tools/UpdateValidation/UpdateValidation.csproj -c Release
      - name: Build installer and portable package
        id: package
        run: ./tools/build-release.ps1 -Counter (99 + [int]$env:GITHUB_RUN_NUMBER)
      - name: Verify installer upgrade preserves data
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_DIR: ${{ steps.package.outputs.release-dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $previous = gh release list --limit 100 --json tagName,isDraft,isPrerelease | ConvertFrom-Json | Where-Object { !$_.isDraft -and !$_.isPrerelease } | Select-Object -First 1
          if (!$previous) { Write-Host 'No previous installer is available for an upgrade test.'; exit 0 }
          $baseline = Join-Path $env:RUNNER_TEMP 'previous-installer'
          New-Item -ItemType Directory -Force -Path $baseline | Out-Null
          gh release download $previous.tagName --pattern '*Setup-*-win-x64.exe' --dir $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Could not obtain previous installer for validation.' }
          $old = (Get-ChildItem -LiteralPath $baseline -Filter '*.exe' | Select-Object -First 1).FullName
          $new = Join-Path $env:RELEASE_DIR "RetroGamingCollection-Setup-$env:RELEASE_VERSION-win-x64.exe"
          ./tools/test-installer.ps1 -OldInstaller $old -NewInstaller $new -ExpectedVersion $env:RELEASE_VERSION -SkipAppBoot
      - name: Publish complete release with changelog
        # Only validated installers are published.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_DIR: ${{ steps.package.outputs.release-dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          $existing = gh release view $tag --json isDraft 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0 -and !$existing.isDraft) {
            Write-Host "Release $tag is already published; leaving it unchanged."
            exit 0
          }
          $releases = gh release list --limit 100 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases.' }
          $previous = $releases | Where-Object { !$_.isDraft -and !$_.isPrerelease -and $_.tagName -match '^v\d+\.\d{2}$' } | Sort-Object { [decimal]$_.tagName.Substring(1) } -Descending | Select-Object -First 1
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          if ($previous) {
            $subjects = git log --format='- %s' "$($previous.tagName)..$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Could not generate release notes.' }
            $notes = @("## Changes in $env:RELEASE_VERSION", '', $subjects, '', 'Windows x64 installer and portable package. Games, BIOS files, emulators, user data and local inventories are not included.')
          } else {
            $notes = @(Get-Content CHANGELOG.md -Raw)
          }
          $notes | Set-Content -LiteralPath $notesPath -Encoding utf8
          if (!$existing) {
            gh release create $tag --target $env:GITHUB_SHA --title "RetroGaming Collection $env:RELEASE_VERSION" --notes-file $notesPath --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          $assets = Get-ChildItem -LiteralPath $env:RELEASE_DIR -File | Where-Object { $_.Extension -in '.exe','.zip','.txt' }
          gh release upload $tag @($assets.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets.' }
          gh release edit $tag --draft=false --latest --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
      - name: Keep build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/release-*/*
          if-no-files-found: ignore
